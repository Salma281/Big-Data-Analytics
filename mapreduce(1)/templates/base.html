<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapReduce Lab</title>
<style>
:root{--bg:#f2f5f8;--panel:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dde5;
--map:#1f5fa8;--red:#b4540b;--r1:#0f766e;--r2:#6d28d9;--r1bg:#d9f2ee;--r2bg:#ece4fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:1.9rem;margin:0 0 4px}h2{font-size:1.3rem;margin:34px 0 10px}h3{font-size:1rem;margin:0 0 8px}
p.lead{color:var(--mute);margin:0 0 22px;max-width:64ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
select,input[type=file]{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}
.choice{display:flex;gap:12px;flex-wrap:wrap}
.choice label{flex:1 1 240px;border:1px solid var(--line);border-radius:6px;padding:12px;margin:0;font-weight:400;cursor:pointer}
.choice input{margin-right:8px}.choice b{display:block}
button,.btn{background:var(--map);color:#fff;border:0;border-radius:6px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.btn.alt{background:#fff;color:var(--map);border:1px solid var(--map)}
.err{background:#fde8e8;border:1px solid #e3a0a0;color:#8a1c1c;padding:10px 14px;border-radius:6px;margin-bottom:16px}
.hint{color:var(--mute);font-size:.9rem;margin:4px 0 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:#eaf0f5}td.num{font-family:Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:.82rem Consolas,monospace;background:#e8eef4;border-radius:4px;padding:2px 7px;white-space:nowrap}
.chip.r1{background:var(--r1bg);color:var(--r1)}.chip.r2{background:var(--r2bg);color:var(--r2)}
.phase{border-left:5px solid var(--map);padding-left:14px}.phase.reduce{border-color:var(--red)}
.split{margin:14px 0}.split header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.meta{color:var(--mute);font-size:.88rem}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stage{border-top:3px solid var(--line);padding-top:8px}.stage h3{font-size:.95rem}
.stage.m{border-color:var(--map)}.stage.c{border-color:#6b7f93}.stage.p{border-color:var(--r2)}
pre{margin:0;white-space:pre-wrap;font:.85rem Consolas,monospace;background:#f2f5f8;padding:8px;border-radius:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tag{display:inline-block;border-radius:4px;padding:1px 8px;font-size:.85rem;font-weight:600}
.tag.r1{background:var(--r1bg);color:var(--r1)}.tag.r2{background:var(--r2bg);color:var(--r2)}
.barrier{text-align:center;margin:26px 0 0;color:var(--mute);border-top:2px dashed var(--line);padding-top:8px}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.tabs{display:flex;gap:4px;margin-left:auto;background:#e3eaf1;border-radius:8px;padding:4px}
.tabs a{padding:7px 14px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:600;transition:background .2s}
.tabs a:hover{background:#fff}.tabs a[aria-current=page]{background:var(--map);color:#fff}
.saved{background:#e6f1fb;border:1px solid #b9d3ec;border-radius:6px;padding:10px 14px;margin-bottom:14px}
.overlay{position:fixed;inset:0;background:rgba(242,245,248,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;font-weight:600}
.overlay[hidden]{display:none}
.spin{width:46px;height:46px;border:5px solid #cfe0f1;border-top-color:var(--map);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel,.choice label,button,.btn{transition:box-shadow .2s,border-color .2s,transform .15s}
.choice label:hover{border-color:var(--map);box-shadow:0 2px 10px rgba(31,95,168,.15)}
.choice label:has(input:checked){border-color:var(--map);background:#eef5fc}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1px)}
button:disabled{opacity:.7;cursor:progress}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
</style></head><body><main>{% block body %}{% endblock %}</main></body></html>
